<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Main symbol gradient -->
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft inner glow -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip to rounded square -->
    <clipPath id="roundedSquare">
      <rect width="512" height="512" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <!-- Base: rounded square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- Subtle radial glow behind symbol -->
  <radialGradient id="centerGlow" cx="50%" cy="50%" r="40%">
    <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="110" fill="url(#centerGlow)"/>

  <!-- Outer ring / border -->
  <rect x="10" y="10" width="492" height="492" rx="104" ry="104"
        fill="none" stroke="#6366f1" stroke-opacity="0.22" stroke-width="2.5"/>

  <!-- ══════════════════════════════════
       CENTRAL SYMBOL: Nexus / Lightning
       A bold hexagonal node cluster with
       a central lightning bolt core.
  ═══════════════════════════════════ -->

  <!-- Outer hexagonal ring nodes (6 circles at vertices) -->
  <g filter="url(#softglow)" opacity="0.75">
    <circle cx="256" cy="118" r="18" fill="#6366f1" opacity="0.7"/>
    <circle cx="374" cy="187" r="18" fill="#6366f1" opacity="0.7"/>
    <circle cx="374" cy="325" r="18" fill="#6366f1" opacity="0.7"/>
    <circle cx="256" cy="394" r="18" fill="#6366f1" opacity="0.7"/>
    <circle cx="138" cy="325" r="18" fill="#6366f1" opacity="0.7"/>
    <circle cx="138" cy="187" r="18" fill="#6366f1" opacity="0.7"/>
  </g>

  <!-- Connecting lines forming the hexagon -->
  <g stroke="#6366f1" stroke-width="3.5" stroke-opacity="0.35" fill="none">
    <line x1="256" y1="118" x2="374" y2="187"/>
    <line x1="374" y1="187" x2="374" y2="325"/>
    <line x1="374" y1="325" x2="256" y2="394"/>
    <line x1="256" y1="394" x2="138" y2="325"/>
    <line x1="138" y1="325" x2="138" y2="187"/>
    <line x1="138" y1="187" x2="256" y2="118"/>
  </g>

  <!-- Inner spokes from center to vertices -->
  <g stroke="url(#symbolGrad)" stroke-width="2.5" stroke-opacity="0.5" fill="none">
    <line x1="256" y1="256" x2="256" y2="118"/>
    <line x1="256" y1="256" x2="374" y2="187"/>
    <line x1="256" y1="256" x2="374" y2="325"/>
    <line x1="256" y1="256" x2="256" y2="394"/>
    <line x1="256" y1="256" x2="138" y2="325"/>
    <line x1="256" y1="256" x2="138" y2="187"/>
  </g>

  <!-- Central lightning bolt — the "AI" core -->
  <g filter="url(#glow)" transform="translate(256,256)">
    <polygon
      points="20,-72  -8,-8  22,-8  -20,72  8,8  -22,8"
      fill="url(#symbolGrad)"
    />
  </g>

  <!-- Center dot / hub -->
  <circle cx="256" cy="256" r="10" fill="#ffffff" opacity="0.95" filter="url(#softglow)"/>

  <!-- Outer ring nodes: bright filled versions on top -->
  <g fill="url(#symbolGrad)">
    <circle cx="256" cy="118" r="9"/>
    <circle cx="374" cy="187" r="9"/>
    <circle cx="374" cy="325" r="9"/>
    <circle cx="256" cy="394" r="9"/>
    <circle cx="138" cy="325" r="9"/>
    <circle cx="138" cy="187" r="9"/>
  </g>
</svg>

