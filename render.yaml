# Render Blueprint Specification
# Qualifies for "Best Use of Render" Sponsor Prize ($1,000 / $750 / $500)
services:
  - type: web
    name: nexuscommerce-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false

